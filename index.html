<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출석·시험·성적 통합관리</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dde2ea;--accent:#315efb;--soft:#eef2ff;--bad:#b42318;--ok:#067647;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.coursepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}textarea{min-height:150px;resize:vertical}button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 14px;cursor:pointer}.primary,.tabs .active,.coursepick .active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.danger{color:var(--bad);border-color:#f1b4ae}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}.q{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{display:flex;justify-content:center;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;min-height:44px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;min-width:900px;width:100%}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}th{background:#f9fafb;position:sticky;top:0}.left{text-align:left}.notice{padding:12px;border:1px solid #f0c36d;background:#fff8e6;border-radius:12px}.score{font-size:24px;font-weight:800}.qrbox{display:flex;justify-content:center;align-items:center;min-height:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:var(--soft);font-size:12px;font-weight:700}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.toolbar>label{min-width:190px}.mini{min-height:36px;padding:6px 10px;font-size:13px}.section-title{margin:0 0 10px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.stat .n{font-size:20px;font-weight:800;margin-top:4px}.ansgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.soft{background:var(--soft)}.bigqr .qrbox{min-height:360px}.bigqr canvas,.bigqr img{width:320px!important;height:320px!important}.pulse{font-size:28px;font-weight:900}.essay textarea{min-height:220px}.criteria{background:#fafbff}.coursepick button{min-height:54px;font-weight:700}.smallbtn{min-height:34px;padding:5px 9px;font-size:12px}.right{text-align:right}.w100{width:100%}.pledgebox{white-space:pre-wrap;line-height:1.65;background:#fafbff;border:1px solid var(--line);border-radius:12px;padding:14px}.signature-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}.signature-pad{display:block;width:100%;height:180px;border:1px dashed #98a2b3;border-radius:8px;background:#fff;touch-action:none}.sigmini{max-width:180px;max-height:70px;border:1px solid var(--line);background:#fff}
@media(max-width:720px){.g2,.g3,.g4,.coursepick{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,1fr)}.ansgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}table{min-width:760px}.bigqr canvas,.bigqr img{width:260px!important;height:260px!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div><h2 style="margin:0">출석·시험·성적 통합관리</h2><div id="publicSemesterLabel" class="muted">활성 학기 확인 중…</div></div>
    <div class="tabs"><button id="studentMode" class="active">학생</button><button id="teacherMode">교수자</button></div>
  </div>
  <div id="setupNotice" class="notice hidden">공용 DB 연결 설정을 확인하세요.</div>

  <section id="studentSection">
    <div id="loginCard" class="card">
      <h3 class="section-title">학생 로그인</h3>
      <div class="coursepick" id="studentCoursePick">
        <button data-course="chinese1" class="active">소형1 · 중국어1</button>
        <button data-course="chinese2">소형2 · 중국어2</button>
        <button data-course="large1">대형1</button>
        <button data-course="large2">대형2</button>
      </div>
      <div class="grid g2"><label>학번<input id="sid" inputmode="numeric" placeholder="본인 학번"></label><label>이름<input id="sname" placeholder="출석부 이름 그대로"></label></div>
      <button id="loginBtn" class="primary" style="margin-top:10px">로그인</button><div id="loginMsg" class="muted" style="margin-top:8px"></div>
    </div>
    <div id="studentApp" class="hidden">
      <div class="card row"><b id="who"></b><button id="logoutBtn">로그아웃</button></div>
      <div id="studentGroupCard" class="card hidden"></div>
      <div class="tabs" id="stabs">
        <button data-tab="attendance" class="active">출석</button>
        <button id="sQuizTab" data-tab="quiz">듣기평가</button>
        <button data-tab="final">기말고사</button>
        <button data-tab="homework">과제</button>
        <button id="sPledgeTab" data-tab="pledge" class="hidden">각서</button>
        <button data-tab="scores">내 성적</button>
      </div>
      <div id="attendancePane" class="spane"></div><div id="quizPane" class="spane hidden"></div><div id="finalPane" class="spane hidden"></div><div id="homeworkPane" class="spane hidden"></div><div id="pledgePane" class="spane hidden"></div><div id="scoresPane" class="spane hidden"></div>
    </div>
  </section>

  <section id="teacherSection" class="hidden">
    <div id="teacherLogin" class="card">
      <h3 class="section-title">교수자 로그인</h3>
      <div class="grid g2"><label>이메일<input id="temail" type="email" value="kaixin@inu.ac.kr"></label><label>비밀번호<input id="tpassword" type="password"></label></div>
      <button id="teacherLoginBtn" class="primary" style="margin-top:10px">로그인</button><div id="teacherMsg" class="muted" style="margin-top:8px"></div>
    </div>
    <div id="teacherApp" class="hidden">
      <div class="card row">
        <div class="toolbar"><label>관리할 학기<select id="semesterSelect"></select></label><label>과목<select id="teacherCourseSelect"><option value="chinese1">소형1 · 중국어1</option><option value="chinese2">소형2 · 중국어2</option><option value="large1">대형1</option><option value="large2">대형2</option></select></label><span id="semesterBadge" class="badge"></span></div>
        <button id="teacherLogoutBtn">교수자 로그아웃</button>
      </div>
      <div class="tabs" id="ttabs">
        <button data-tab="semester" class="active">학기·명단</button><button data-tab="qr">학생접속 QR</button><button data-tab="attendance">출석설정</button><button id="tQuizTab" data-tab="quiz">듣기평가</button><button id="tMidtermTab" data-tab="midterm" class="hidden">중간발표</button><button data-tab="final">기말고사</button><button data-tab="homework">과제</button><button id="tPledgeTab" data-tab="pledge" class="hidden">각서</button><button data-tab="grades">성적</button>
      </div>
      <div id="tsemester" class="tpane"></div><div id="tqr" class="tpane hidden"></div><div id="tattendance" class="tpane hidden"></div><div id="tquiz" class="tpane hidden"></div><div id="tmidterm" class="tpane hidden"></div><div id="tfinal" class="tpane hidden"></div><div id="thomework" class="tpane hidden"></div><div id="tpledge" class="tpane hidden"></div><div id="tgrades" class="tpane hidden"></div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
